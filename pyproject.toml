[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-heston"
version = "0.1.0"
description = "Neural Heston pricer trained by differential machine learning, with an independent validation report."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "torch"]

[project.optional-dependencies]
dev = ["pytest", "matplotlib", "riskhub-engine", "markdown"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
